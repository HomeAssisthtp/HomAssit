; Proyecto PlatformIO del firmware HomeAssist (ESP32).
; Abre la carpeta "firmware" en VS Code con la extensión PlatformIO IDE:
;   ✓ Build   → compila      → Upload  → carga al ESP32      🔌 Monitor → ver el Monitor serie
; El código es el mismo que usa Arduino IDE (homeassist_esp32/homeassist_esp32.ino).

[platformio]
src_dir = homeassist_esp32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
